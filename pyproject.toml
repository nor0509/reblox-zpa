[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-niche-finder"
version = "0.1.0"
description = "Data ingestion pipeline and analytical framework for Steam market niche discovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "tenacity>=8.3.0,<9.0.0",
    "duckdb>=1.0.0,<2.0.0",
    "typer>=0.12.0,<1.0.0",
    "rich>=13.7.0,<14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "respx>=0.21.0,<1.0.0",
    "ruff>=0.4.0,<1.0.0",
]

[project.scripts]
steam-pipeline = "src.cli:app"

# Jawna deklaracja pakietu 'src' wyłącza domyślną heurystykę setuptools, która gubi się
# przy obecności katalogów analitycznych (data, notebooks, reports) w korzeniu repozytorium.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"